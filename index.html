<!DOCTYPE html>
<html lang="sr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nedeljni Planer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Podrška za Tailwind tamnu temu putem klase na html elementu
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Custom vertikalni scrollbar unutar kolona dana */
        .day-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .day-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .day-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .dark .day-scroll::-webkit-scrollbar-thumb {
            background: #475569; 
        }
        .day-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Animacije modala */
        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 200ms ease-out, transform 200ms ease-out;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">

    <!-- Header: Naslov, Dark Mode prekidač, Datum i Vreme -->
    <header class="bg-white dark:bg-slate-800 shadow-sm z-10 px-4 md:px-6 py-3 flex justify-between items-center border-b border-slate-200 dark:border-slate-700 transition-colors duration-200">
        <div class="flex items-center gap-3">
            <h1 class="text-xl md:text-2xl font-bold text-indigo-600 dark:text-indigo-400 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span class="hidden sm:inline">Nedeljni Planer</span>
            </h1>

            <!-- Prekidač za Light/Dark Mode -->
            <button id="theme-toggle" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500" title="Promeni temu (Svetla/Tamna)">
                <!-- Ikonica Meseca (prikazuje se u svetlom modu) -->
                <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
                <!-- Ikonica Sunca (prikazuje se u tamnom modu) -->
                <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                </svg>
            </button>
        </div>

        <div class="text-right">
            <div id="live-time" class="text-2xl md:text-3xl font-light tracking-tight text-slate-800 dark:text-slate-100">--:--:--</div>
            <div id="live-date" class="text-xs md:text-sm font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wide">Učitavanje...</div>
        </div>
    </header>

    <!-- Main Content: Horizontalni pregled 7 dana koji uklapa sve u širinu (Fit to width) -->
    <main class="flex-1 p-2 md:p-4 overflow-hidden">
        <div id="week-container" class="grid grid-cols-7 gap-1.5 md:gap-3 h-full w-full">
            <!-- 7 Kolona za dane (generiše JS sa jednakom širinom grid-cols-7) -->
        </div>
    </main>

    <!-- Footer: Navigacija na dnu (Donji levi / desni ugao) -->
    <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 px-4 md:px-6 py-3 flex justify-between items-center z-10 transition-colors duration-200">
        <!-- Donji levi ugao -->
        <button id="btn-prev-week" class="flex items-center gap-1.5 px-3 md:px-5 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl font-medium text-xs md:text-sm transition-colors shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 md:h-5 md:w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
            <span>Prethodna nedelja</span>
        </button>
        
        <!-- Prikaz raspona trenutne nedelje -->
        <div id="current-week-label" class="text-xs md:text-sm font-semibold text-slate-600 dark:text-slate-300 text-center">
            <!-- Popunjava JS -->
        </div>

        <!-- Donji desni ugao -->
        <button id="btn-next-week" class="flex items-center gap-1.5 px-3 md:px-5 py-2 bg-indigo-50 dark:bg-indigo-950/60 hover:bg-indigo-100 dark:hover:bg-indigo-900 text-indigo-700 dark:text-indigo-300 rounded-xl font-medium text-xs md:text-sm transition-colors shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <span>Sledeća nedelja</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 md:h-5 md:w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
            </svg>
        </button>
    </footer>

    <!-- Modal za unos/izmenu događaja -->
    <div id="event-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 opacity-0 transition-all duration-200 border border-slate-200 dark:border-slate-700" id="modal-content">
            
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-100" id="modal-title">Novi događaj</h3>
                <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 focus:outline-none rounded-lg p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <form id="event-form" class="p-6 space-y-4">
                <input type="hidden" id="event-date">
                <input type="hidden" id="event-id">
                
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Naziv događaja <span class="text-rose-500">*</span></label>
                    <input type="text" id="event-title" required class="w-full px-3.5 py-2 bg-slate-50 dark:bg-slate-700/50 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 dark:text-slate-100 transition-shadow text-sm" placeholder="Npr. Sastanak sa klijentom">
                </div>

                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Vreme <span class="text-rose-500">*</span></label>
                        <input type="time" id="event-time" required class="w-full px-3.5 py-2 bg-slate-50 dark:bg-slate-700/50 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 dark:text-slate-100 transition-shadow text-sm">
                    </div>
                </div>

                <!-- Odabir boja sa brzim paletama i color picker-om -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Boja / Prioritet</label>
                    <div class="flex items-center gap-2">
                        <!-- Brze preset boje -->
                        <div class="flex gap-1.5 flex-1 overflow-x-auto py-1" id="color-presets">
                            <button type="button" data-color="#ef4444" class="w-7 h-7 rounded-full bg-red-500 hover:scale-110 transition-transform focus:ring-2 focus:ring-offset-1 focus:ring-red-500 outline-none"></button>
                            <button type="button" data-color="#f97316" class="w-7 h-7 rounded-full bg-orange-500 hover:scale-110 transition-transform focus:ring-2 focus:ring-offset-1 focus:ring-orange-500 outline-none"></button>
                            <button type="button" data-color="#eab308" class="w-7 h-7 rounded-full bg-yellow-500 hover:scale-110 transition-transform focus:ring-2 focus:ring-offset-1 focus:ring-yellow-500 outline-none"></button>
                            <button type="button" data-color="#10b981" class="w-7 h-7 rounded-full bg-emerald-500 hover:scale-110 transition-transform focus:ring-2 focus:ring-offset-1 focus:ring-emerald-500 outline-none"></button>
                            <button type="button" data-color="#06b6d4" class="w-7 h-7 rounded-full bg-cyan-500 hover:scale-110 transition-transform focus:ring-2 focus:ring-offset-1 focus:ring-cyan-500 outline-none"></button>
                            <button type="button" data-color="#6366f1" class="w-7 h-7 rounded-full bg-indigo-500 hover:scale-110 transition-transform focus:ring-2 focus:ring-offset-1 focus:ring-indigo-500 outline-none"></button>
                            <button type="button" data-color="#a855f7" class="w-7 h-7 rounded-full bg-purple-500 hover:scale-110 transition-transform focus:ring-2 focus:ring-offset-1 focus:ring-purple-500 outline-none"></button>
                            <button type="button" data-color="#ec4899" class="w-7 h-7 rounded-full bg-pink-500 hover:scale-110 transition-transform focus:ring-2 focus:ring-offset-1 focus:ring-pink-500 outline-none"></button>
                        </div>
                        <!-- Prilagođeni picker -->
                        <div class="relative flex items-center justify-center">
                            <input type="color" id="event-color" value="#6366f1" class="w-8 h-8 rounded-lg cursor-pointer border-0 bg-transparent p-0">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Ime i kontakt osobe</label>
                    <input type="text" id="event-contact" class="w-full px-3.5 py-2 bg-slate-50 dark:bg-slate-700/50 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 dark:text-slate-100 transition-shadow text-sm" placeholder="Npr. Milan, 064 1234 567">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Adresa / Lokacija</label>
                    <input type="text" id="event-address" class="w-full px-3.5 py-2 bg-slate-50 dark:bg-slate-700/50 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 dark:text-slate-100 transition-shadow text-sm" placeholder="Npr. Kneza Miloša 15, Beograd">
                </div>

                <div class="mt-6 flex justify-end gap-2.5 pt-4 border-t border-slate-100 dark:border-slate-700">
                    <button type="button" id="btn-cancel" class="px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Otkaži</button>
                    <button type="submit" class="px-5 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 rounded-xl transition-colors shadow-sm focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Sačuvaj</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast kontejner za obaveštenja -->
    <div id="toast-container" class="fixed bottom-20 right-6 z-50 flex flex-col gap-2"></div>

    <script>
        // Nazivi dana i meseci na srpskom
        const DANI = ['Nedelja', 'Ponedeljak', 'Utorak', 'Sreda', 'Četvrtak', 'Petak', 'Subota'];
        const MESECI = ['Januar', 'Februar', 'Mart', 'April', 'Maj', 'Jun', 'Jul', 'Avgust', 'Septembar', 'Oktobar', 'Novembar', 'Decembar'];

        // Držanje stanja
        let currentWeekStart = getMonday(new Date());
        let events = JSON.parse(localStorage.getItem('plannerEvents')) || [];

        // Dark Mode Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function initTheme() {
            const savedTheme = localStorage.getItem('color-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                darkIcon.classList.remove('hidden');
                lightIcon.classList.add('hidden');
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
                darkIcon.classList.remove('hidden');
                lightIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            }
        });

        // Vraća Ponedeljak za nedelju iz izabranog datuma
        function getMonday(d) {
            d = new Date(d);
            let day = d.getDay();
            let diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        // Formatiraj u lokalni datum 'YYYY-MM-DD'
        function toLocalISODate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Prikaz prilagođenog toast obaveštenja
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `px-4 py-2.5 rounded-xl shadow-lg text-xs md:text-sm font-medium transform transition-all duration-300 translate-y-10 opacity-0 ${
                type === 'success' ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'
            }`;
            toast.innerText = message;
            
            const container = document.getElementById('toast-container');
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Živi sat i provera notifikacija
        function updateClock() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-time').innerText = `${hours}:${minutes}:${seconds}`;
            
            const dayName = DANI[now.getDay()];
            const day = now.getDate();
            const month = MESECI[now.getMonth()];
            const year = now.getFullYear();
            document.getElementById('live-date').innerText = `${dayName}, ${day}. ${month} ${year}.`;

            checkNotifications(now, hours, minutes);
        }

        // Provera događaja i slanje notifikacija
        function checkNotifications(now, currentHours, currentMinutes) {
            if (Notification.permission !== "granted") return;

            const todayStr = toLocalISODate(now);
            const currentTimeStr = `${currentHours}:${currentMinutes}`;
            let updated = false;

            events.forEach(event => {
                if (event.date === todayStr && event.time === currentTimeStr && !event.notified) {
                    new Notification(`Podsetnik: ${event.title}`, {
                        body: `Vreme: ${event.time}${event.address ? '\nLokacija: ' + event.address : ''}${event.contact ? '\nKontakt: ' + event.contact : ''}`,
                        icon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%236366f1"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>'
                    });
                    
                    event.notified = true;
                    updated = true;
                }
            });

            if (updated) {
                saveEventsToStorage();
            }
        }

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        // Isrtavanje cele nedelje
        function renderWeek() {
            const container = document.getElementById('week-container');
            container.innerHTML = '';

            const endOfWeek = new Date(currentWeekStart);
            endOfWeek.setDate(currentWeekStart.getDate() + 6);
            document.getElementById('current-week-label').innerText = 
                `${currentWeekStart.getDate()}. ${MESECI[currentWeekStart.getMonth()].substring(0,3)} - ${endOfWeek.getDate()}. ${MESECI[endOfWeek.getMonth()].substring(0,3)} ${endOfWeek.getFullYear()}.`;

            const todayStr = toLocalISODate(new Date());

            // Kreiraj po 1 kolonu za svih 7 dana (uklapa se tačno u grid-cols-7)
            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(currentWeekStart);
                dayDate.setDate(currentWeekStart.getDate() + i);
                
                const dateStr = toLocalISODate(dayDate);
                const isToday = dateStr === todayStr;

                const column = document.createElement('div');
                column.className = `flex flex-col h-full bg-white dark:bg-slate-800 rounded-2xl shadow-sm border ${
                    isToday 
                        ? 'border-indigo-500 ring-2 ring-indigo-500/20 dark:ring-indigo-400/30' 
                        : 'border-slate-200 dark:border-slate-700/70'
                } overflow-hidden transition-colors duration-200`;

                // Zaglavlje dana
                const header = document.createElement('div');
                header.className = `p-2.5 md:p-3 flex items-center justify-between cursor-pointer transition-colors ${
                    isToday 
                        ? 'bg-indigo-50/80 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300' 
                        : 'bg-slate-50 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50'
                } border-b border-slate-100 dark:border-slate-700/60`;
                header.onclick = () => openModal(dateStr);
                
                const dayNameIndex = dayDate.getDay();
                
                header.innerHTML = `
                    <div class="truncate">
                        <span class="block text-[10px] md:text-xs font-bold uppercase tracking-wider ${isToday ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400 dark:text-slate-400'}">${DANI[dayNameIndex]}</span>
                        <span class="block text-base md:text-xl font-bold leading-tight">${dayDate.getDate()}.</span>
                    </div>
                    <button class="w-6 h-6 md:w-7 md:h-7 rounded-lg flex items-center justify-center ${
                        isToday ? 'bg-indigo-200 dark:bg-indigo-800 text-indigo-800 dark:text-indigo-100' : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300'
                    } hover:bg-indigo-600 hover:text-white dark:hover:bg-indigo-500 transition-colors shadow-sm flex-shrink-0" title="Dodaj događaj">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                `;

                // Kontejner događaja sa uskim scrollbarom
                const eventsContainer = document.createElement('div');
                eventsContainer.className = 'flex-1 p-1.5 md:p-2.5 overflow-y-auto space-y-2 day-scroll';

                const dayEvents = events.filter(e => e.date === dateStr).sort((a, b) => a.time.localeCompare(b.time));

                if (dayEvents.length === 0) {
                    eventsContainer.innerHTML = `<div class="text-center text-[11px] md:text-xs text-slate-400 dark:text-slate-500 mt-6 italic">Nema planova</div>`;
                } else {
                    dayEvents.forEach(event => {
                        eventsContainer.appendChild(createEventCard(event));
                    });
                }

                column.appendChild(header);
                column.appendChild(eventsContainer);
                container.appendChild(column);
            }
        }

        // Kreiranje kartice događaja
        function createEventCard(event) {
            const card = document.createElement('div');
            card.className = 'bg-slate-50 dark:bg-slate-700/40 rounded-xl border border-slate-200/80 dark:border-slate-600/50 p-2 md:p-2.5 relative group hover:shadow-md transition-all flex flex-col gap-1';
            card.style.borderLeftWidth = '4px';
            card.style.borderLeftColor = event.color || '#6366f1';

            card.innerHTML = `
                <div class="flex justify-between items-center gap-1">
                    <span class="text-[10px] md:text-xs font-bold px-1.5 py-0.5 rounded bg-white dark:bg-slate-800 shadow-2xs" style="color: ${event.color || '#6366f1'}">
                        ${event.time}
                    </span>
                    <button onclick="deleteEvent('${event.id}', event)" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 transition-opacity p-0.5" title="Obriši">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
                <h4 class="font-semibold text-slate-800 dark:text-slate-100 text-xs md:text-sm leading-tight break-words mt-0.5">${event.title}</h4>
                ${event.contact ? `<div class="text-[10px] md:text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1 truncate"><svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg><span class="truncate">${event.contact}</span></div>` : ''}
                ${event.address ? `<div class="text-[10px] md:text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1 truncate"><svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg><span class="truncate">${event.address}</span></div>` : ''}
            `;
            
            return card;
        }

        function saveEventsToStorage() {
            localStorage.setItem('plannerEvents', JSON.stringify(events));
        }

        window.deleteEvent = function(id, e) {
            e.stopPropagation();
            events = events.filter(ev => ev.id !== id);
            saveEventsToStorage();
            renderWeek();
            showToast('Događaj je uklonjen.');
        };

        // Upravljanje modalom za dodavanje
        const modal = document.getElementById('event-modal');
        const modalContent = document.getElementById('modal-content');
        
        function openModal(dateStr = '') {
            document.getElementById('event-date').value = dateStr;
            document.getElementById('event-id').value = '';
            document.getElementById('event-form').reset();
            document.getElementById('event-color').value = '#6366f1';
            
            if(dateStr) {
                const d = new Date(dateStr);
                document.getElementById('modal-title').innerText = `Novi događaj - ${d.getDate()}. ${MESECI[d.getMonth()]}`;
            } else {
                document.getElementById('modal-title').innerText = `Novi događaj`;
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
            
            document.getElementById('event-title').focus();
            requestNotificationPermission();
        }

        function closeModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        document.getElementById('btn-close-modal').addEventListener('click', closeModal);
        document.getElementById('btn-cancel').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Brze palete boja
        document.querySelectorAll('#color-presets button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const color = e.currentTarget.getAttribute('data-color');
                document.getElementById('event-color').value = color;
            });
        });

        // Sačuvaj događaj
        document.getElementById('event-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const date = document.getElementById('event-date').value || toLocalISODate(new Date());
            const title = document.getElementById('event-title').value.trim();
            const time = document.getElementById('event-time').value;
            const contact = document.getElementById('event-contact').value.trim();
            const address = document.getElementById('event-address').value.trim();
            const color = document.getElementById('event-color').value;

            if(!title || !time) return;

            const newEvent = {
                id: 'evt_' + Date.now().toString(36) + Math.random().toString(36).substr(2),
                date,
                title,
                time,
                contact,
                address,
                color,
                notified: false
            };

            const now = new Date();
            if(date === toLocalISODate(now) && time < `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`) {
                newEvent.notified = true; 
            }

            events.push(newEvent);
            saveEventsToStorage();
            renderWeek();
            closeModal();
            showToast('Događaj je uspešno dodat!');
        });

        // Dugmad za menjanje nedelja (Donji levi / desni ugao)
        document.getElementById('btn-prev-week').addEventListener('click', () => {
            currentWeekStart.setDate(currentWeekStart.getDate() - 7);
            renderWeek();
        });

        document.getElementById('btn-next-week').addEventListener('click', () => {
            currentWeekStart.setDate(currentWeekStart.getDate() + 7);
            renderWeek();
        });

        // Inicijalizacija pri učitavanju
        function init() {
            initTheme();
            updateClock();
            setInterval(updateClock, 1000);
            renderWeek();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
