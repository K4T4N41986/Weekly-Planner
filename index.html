<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nedeljni Planer</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --border-color: #ddd;
            --header-bg: #2c3e50;
            --header-text: #fff;
            --btn-bg: #3498db;
            --btn-hover: #2980b9;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #e6e6e6;
            --card-bg: #16213e;
            --border-color: #0f3460;
            --header-bg: #0f3460;
            --header-text: #fff;
            --btn-bg: #e94560;
            --btn-hover: #d13b52;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; transition: 0.3s; }
        
        /* Header */
        header { background-color: var(--header-bg); color: var(--header-text); padding: 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .date-time { font-weight: bold; font-size: 1.1em; }
        .theme-toggle { background: var(--btn-bg); color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 0.9em; }
        
        /* Main Content - Horizontal Layout for Mobile */
        .week-container { display: flex; flex-direction: column; flex-grow: 1; overflow-y: auto; padding: 10px; gap: 10px; }
        .day-column { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; cursor: pointer; transition: 0.2s; min-height: 100px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .day-column:hover { border-color: var(--btn-bg); }
        .day-title { text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 1.2em; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; }
        .events-list { display: flex; flex-direction: column; gap: 8px; }
        .event-card { padding: 10px; border-radius: 6px; font-size: 0.9em; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 5px;}
        
        /* Event card buttons */
        .card-actions { display: flex; gap: 5px; margin-top: 5px; }
        .cal-btn { background-color: rgba(255, 255, 255, 0.2); color: white; border: 1px solid white; padding: 6px 10px; border-radius: 4px; cursor: pointer; flex: 1; font-size: 0.8em; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .delete-btn { background-color: rgba(255, 0, 0, 0.5); color: white; border: 1px solid white; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        .cal-btn:hover { background-color: rgba(255, 255, 255, 0.4); }

        /* Footer navigation */
        footer { background-color: var(--header-bg); padding: 10px; display: flex; justify-content: space-between; flex-shrink: 0; }
        .nav-btn { background-color: var(--btn-bg); color: #fff; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1em; }
        
        /* Modal for adding events */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background-color: var(--card-bg); padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .modal-content h3 { text-align: center; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--bg-color); color: var(--text-color); }
        .modal-actions { display: flex; justify-content: space-between; margin-top: 10px; }
        .save-btn { background-color: #2ecc71; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 48%; }
        .cancel-btn { background-color: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 48%; }
    </style>
</head>
<body>

    <header>
        <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">Mod</button>
        <div class="date-time" id="clock">Datum i Vreme</div>
    </header>

    <div class="week-container" id="weekContainer">
        <!-- Dani se generišu preko JS -->
    </div>

    <footer>
        <button class="nav-btn" onclick="changeWeek(-1)">◀ Prethodna</button>
        <button class="nav-btn" onclick="changeWeek(1)">Sledeća ▶</button>
    </footer>

    <!-- Modal za unos događaja -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h3 id="modalTitle">Novi događaj</h3>
            <input type="hidden" id="eventDate">
            <input type="text" id="eventName" placeholder="Naziv događaja (Obavezno)">
            <input type="time" id="eventTime">
            <input type="text" id="eventPerson" placeholder="Ime i kontakt osobe">
            <input type="text" id="eventAddress" placeholder="Adresa">
            <select id="eventColor">
                <option value="#3498db">Plava (Standardno)</option>
                <option value="#e74c3c">Crvena (Visok prioritet)</option>
                <option value="#f1c40f">Žuta (Srednji prioritet)</option>
                <option value="#2ecc71">Zelena (Nizak prioritet)</option>
                <option value="#9b59b6">Ljubičasta (Lično)</option>
                <option value="#e67e22">Narandžasta (Posao)</option>
                <option value="#34495e">Siva (Ostalo)</option>
            </select>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">Odustani</button>
                <button class="save-btn" onclick="saveEvent()">Sačuvaj</button>
            </div>
        </div>
    </div>

<script>
    let currentDate = new Date();
    let events = JSON.parse(localStorage.getItem('planer_events')) || {};
    let notifiedEvents = JSON.parse(localStorage.getItem('notified_events')) || {}; // Zadržavamo za laptop

    const daysInWeek = ['Ponedeljak', 'Utorak', 'Sreda', 'Četvrtak', 'Petak', 'Subota', 'Nedelja'];

    // Inicijalizacija
    function init() {
        if(localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }
        updateClock();
        setInterval(updateClock, 1000);
        setInterval(checkNotifications, 30000); // PC notifikacije ostaju
        renderWeek();
    }

    function toggleTheme() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        if(isDark) {
            document.body.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
        } else {
            document.body.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
    }

    function updateClock() {
        const now = new Date();
        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('clock').innerText = now.toLocaleDateString('sr-RS', options);
    }

    // Pronalazi ponedeljak za trenutno izabranu nedelju
    function getStartOfWeek(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
        return new Date(d.setDate(diff));
    }

    function changeWeek(offset) {
        currentDate.setDate(currentDate.getDate() + (offset * 7));
        renderWeek();
    }

    // Funkcija za kreiranje Google Calendar URL-a
    function createGCalLink(eventData, dateString) {
        // Formatiranje datuma za Google Calendar (YYYYMMDDTHHMMSSZ)
        let startTime = "";
        let endTime = "";
        
        if (eventData.time) {
            // Ako imamo vreme, pretvaramo ga u UTC
            const d = new Date(`${dateString}T${eventData.time}:00`);
            const iso = d.toISOString().replace(/-|:|\.\d\d\d/g,""); // Pretvara 2026-10-08T12:00:00.000Z u 20261008T120000Z
            startTime = iso;
            
            // Postavljamo događaj da traje 1 sat podrazumevano
            const endD = new Date(d.getTime() + 60*60*1000);
            endTime = endD.toISOString().replace(/-|:|\.\d\d\d/g,"");
        } else {
            // Ako nema vremena, pravimo celodnevni događaj
            const d = new Date(dateString);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            startTime = `${yyyy}${mm}${dd}`;
            
            const nextD = new Date(d);
            nextD.setDate(nextD.getDate() + 1);
            const nyyyy = nextD.getFullYear();
            const nmm = String(nextD.getMonth() + 1).padStart(2, '0');
            const ndd = String(nextD.getDate()).padStart(2, '0');
            endTime = `${nyyyy}${nmm}${ndd}`;
        }

        const dates = `${startTime}/${endTime}`;
        
        let detailsText = '';
        if (eventData.person) detailsText += `Kontakt osoba: ${eventData.person}\n`;
        
        const text = encodeURIComponent(eventData.name);
        const details = encodeURIComponent(detailsText);
        const location = encodeURIComponent(eventData.address || '');

        return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${dates}&details=${details}&location=${location}`;
    }

    function renderWeek() {
        const container = document.getElementById('weekContainer');
        container.innerHTML = '';
        
        const startOfWeek = getStartOfWeek(currentDate);

        for (let i = 0; i < 7; i++) {
            const currentDay = new Date(startOfWeek);
            currentDay.setDate(startOfWeek.getDate() + i);
            const dateString = currentDay.toISOString().split('T')[0];

            const col = document.createElement('div');
            col.className = 'day-column';
            col.onclick = (e) => {
                // Ne otvaraj modal ako se klikne na dugme
                if(!e.target.classList.contains('delete-btn') && !e.target.classList.contains('cal-btn')) {
                    openModal(dateString);
                }
            };

            const displayDate = currentDay.toLocaleDateString('sr-RS', {day: 'numeric', month: 'numeric'});
            
            col.innerHTML = `
                <div class="day-title">${daysInWeek[i]}<br><small>${displayDate}</small></div>
                <div class="events-list" id="events-${dateString}"></div>
            `;
            container.appendChild(col);

            renderEventsForDay(dateString);
        }
    }

    function renderEventsForDay(dateString) {
        const list = document.getElementById(`events-${dateString}`);
        if (!list) return;
        list.innerHTML = '';

        if (events[dateString]) {
            events[dateString].sort((a, b) => a.time.localeCompare(b.time));

            events[dateString].forEach((ev, index) => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.style.backgroundColor = ev.color;
                
                let details = `<div><strong>${ev.time || 'Ceo dan'} - ${ev.name}</strong></div>`;
                if(ev.person) details += `<div>👤 ${ev.person}</div>`;
                if(ev.address) details += `<div>📍 ${ev.address}</div>`;
                
                // Generišemo link za Google Kalendar
                const gCalLink = createGCalLink(ev, dateString);

                // Dugmići su odvojeni u poseban div
                const actionsHtml = `
                    <div class="card-actions">
                        <a href="${gCalLink}" target="_blank" class="cal-btn" onclick="event.stopPropagation()">📅 Dodaj u Kalendar</a>
                        <button class="delete-btn" onclick="deleteEvent('${dateString}', ${index}, event)">🗑️</button>
                    </div>
                `;
                
                card.innerHTML = details + actionsHtml;
                list.appendChild(card);
            });
        }
    }

    function openModal(date) {
        document.getElementById('eventModal').style.display = 'flex';
        document.getElementById('eventDate').value = date;
        document.getElementById('eventName').value = '';
        document.getElementById('eventTime').value = '';
        document.getElementById('eventPerson').value = '';
        document.getElementById('eventAddress').value = '';
    }

    function closeModal() {
        document.getElementById('eventModal').style.display = 'none';
    }

    function saveEvent() {
        const date = document.getElementById('eventDate').value;
        const name = document.getElementById('eventName').value;
        const time = document.getElementById('eventTime').value;
        const person = document.getElementById('eventPerson').value;
        const address = document.getElementById('eventAddress').value;
        const color = document.getElementById('eventColor').value;

        if (!name) {
            alert('Naziv događaja je obavezan!');
            return;
        }

        if (!events[date]) events[date] = [];
        
        const newEvent = { id: Date.now().toString(), name, time, person, address, color };
        events[date].push(newEvent);
        
        localStorage.setItem('planer_events', JSON.stringify(events));
        renderEventsForDay(date);
        closeModal();
    }

    function deleteEvent(date, index, event) {
        event.stopPropagation(); // Sprečava otvaranje modala pri brisanju
        if(confirm('Da li ste sigurni da želite da obrišete ovaj događaj?')) {
            events[date].splice(index, 1);
            if(events[date].length === 0) delete events[date];
            localStorage.setItem('planer_events', JSON.stringify(events));
            renderEventsForDay(date);
        }
    }

    // Ostaje notifikacija za PC
    function checkNotifications() {
        const now = new Date();
        const currentDateString = now.toISOString().split('T')[0];
        
        const currentHour = now.getHours().toString().padStart(2, '0');
        const currentMinute = now.getMinutes().toString().padStart(2, '0');
        const currentTimeString = `${currentHour}:${currentMinute}`;

        if (events[currentDateString]) {
            events[currentDateString].forEach(ev => {
                if (ev.time === currentTimeString && !notifiedEvents[ev.id]) {
                    
                    try {
                        let audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
                        audio.play();
                    } catch(e) {}

                    if ("Notification" in window && Notification.permission === "granted") {
                        try {
                            new Notification("📅 Podsetnik: " + ev.name, {
                                body: `Vreme: ${ev.time}\nOsoba: ${ev.person || '-'}\nAdresa: ${ev.address || '-'}`,
                                icon: 'https://cdn-icons-png.flaticon.com/512/2361/2361561.png'
                            });
                        } catch(e) {}
                    }

                    notifiedEvents[ev.id] = true;
                    localStorage.setItem('notified_events', JSON.stringify(notifiedEvents));
                }
            });
        }
    }

    window.onload = init;
</script>
</body>
</html>
